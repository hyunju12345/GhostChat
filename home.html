<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Conversation Ended</title>
    <style>
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
            text-align: center;
            background: #000;
            color: #00ff00;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>You exited the conversation.</h2>
    <p>Your reason has been sent to the other user.</p>

    <p id="countdown">0:10</p>
    <button onclick="returnToChat()">Return to Chat</button>

    <script>
        function returnToChat() {
            window.location.href = "index.html";
        }
        // making the timer for when the user choose to click im busy option, followed tutorial: https://www.youtube.com/watch?v=x7WJEmxNlEs
        const startingSeconds = 10; // 10 seconds for quick test
        let time = startingSeconds;

        const countdownEl = document.getElementById('countdown');

        setInterval(updateCountdown, 1000);

        function updateCountdown() {
            const minutes = Math.floor(time / 60);
            let seconds = time % 60;

            seconds = seconds < 10 ? '0' + seconds : seconds;
            countdownEl.innerHTML = `${minutes}:${seconds}`;
            if (time > 0) {
                time--;
            } else {
                countdownEl.innerHTML = "Time up!";
            }
        }
    </script>
</body>

</html>
